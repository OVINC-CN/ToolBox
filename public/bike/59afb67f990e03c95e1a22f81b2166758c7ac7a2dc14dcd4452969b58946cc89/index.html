<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#82d9ef">
  <title>鹈鹕兜风记</title>
  <meta name="description" content="一只鹈鹕骑着自行车，迎着海风快乐兜风。">
  <link rel="stylesheet" href="/59afb67f990e03c95e1a22f81b2166758c7ac7a2dc14dcd4452969b58946cc89/style.css">
</head>
<body>
  <main class="page-shell">
    <header class="topbar">
      <div class="header-left">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">◒</span>
          <div><h1>鹈鹕兜风记</h1><p>沿着海风，慢慢向前。</p></div>
        </div>
      </div>
      <button class="motion-toggle" id="motion-toggle" type="button" aria-pressed="false">
        <span class="toggle-icon" aria-hidden="true">Ⅱ</span><span class="toggle-label">暂停动画</span>
      </button>
    </header>

    <section class="scene-card" aria-label="鹈鹕骑自行车的二维矢量动画">
      <svg id="ride-scene" class="ride-scene" viewBox="0 0 1440 820" role="img" aria-labelledby="scene-title scene-desc">
        <title id="scene-title">鹈鹕骑自行车去兜风</title>
        <desc id="scene-desc">一只戴着蓝色小帽的鹈鹕骑薄荷绿自行车，车轮转动，路旁的草与云朵向后移动。</desc>
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#62cbea"/><stop offset="1" stop-color="#d9f6f1"/>
          </linearGradient>
          <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#20a8c5"/><stop offset="1" stop-color="#087f9c"/>
          </linearGradient>
          <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffb63e"/><stop offset="1" stop-color="#ef7440"/>
          </linearGradient>
          <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="180%">
            <feDropShadow dx="0" dy="13" stdDeviation="11" flood-color="#145765" flood-opacity=".22"/>
          </filter>
          <clipPath id="scene-clip"><rect width="1440" height="820" rx="38"/></clipPath>
          <g id="cloud-shape" fill="#fff" opacity=".9">

          </g>

            <path d="M0 45C0 24 4 9 8 0M3 31C-7 19-17 13-27 9M5 28C17 18 28 14 40 12"/>
          </g>
        </defs>

        <g clip-path="url(#scene-clip)">
          <rect width="1440" height="820" fill="url(#sky)"/>
          <circle cx="1190" cy="145" r="68" fill="#ffd36a" opacity=".95"/>
          <circle cx="1190" cy="145" r="97" fill="none" stroke="#fff4ba" stroke-width="18" opacity=".25"/>

          <g class="cloud cloud-a"><use href="#cloud-shape" transform="translate(180 160) scale(.8)"/></g>
          <g class="cloud cloud-b"><use href="#cloud-shape" transform="translate(970 245) scale(.55)"/></g>
          <g class="cloud cloud-c"><use href="#cloud-shape" transform="translate(1380 100) scale(.68)"/></g>

          <path d="M0 420C210 372 380 410 565 382C770 350 910 391 1090 354C1230 326 1350 342 1440 328V620H0Z" fill="#72d4c6" opacity=".62"/>

          <g class="wave-lines" fill="none" stroke="#a8f4ee" stroke-width="9" stroke-linecap="round" opacity=".7">

                <circle r="94" fill="none" stroke="#58aeb1" stroke-width="5"/>
                <g stroke="#3b7780" stroke-width="4"><path d="M-94 0H94M0-94V94M-66-66L66 66M66-66L-66 66"/></g>
                <circle r="16" fill="#163f4a"/>

              <g fill="none" stroke="#2a9c91" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">

              <g class="leg leg-back" fill="none" stroke="#ef8d37" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">

              <path d="M601 459q-26 58-90 52" fill="none" stroke="#fffaf0" stroke-width="27" stroke-linecap="round"/>
              <path d="M510 511l42 4" fill="none" stroke="#ef8d37" stroke-width="12" stroke-linecap="round"/>
              <path d="M789 441q31 40 58 54" fill="none" stroke="#fffaf0" stroke-width="27" stroke-linecap="round"/>
              <path d="M847 495l8 10" fill="none" stroke="#ef8d37" stroke-width="12" stroke-linecap="round"/>
            </g>
          </g>

          <g class="foreground-plants">
            <use href="#grass-tuft" transform="translate(70 720) scale(1.15)"/><use href="#grass-tuft" transform="translate(1320 700) scale(1.28)"/>
            <use href="#grass-tuft" transform="translate(1160 746) scale(.8)"/><use href="#grass-tuft" transform="translate(285 755) scale(.75)"/>
          </g>
        </g>
      </svg>

      <div class="scene-caption" aria-hidden="true">
        <span class="caption-kicker">海风正好</span>
        <span class="caption-main">叮铃，出发！</span>
      </div>
    </section>
  </main>
