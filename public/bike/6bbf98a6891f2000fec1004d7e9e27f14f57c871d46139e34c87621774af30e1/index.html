<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="鹈鹕骑自行车的 SVG 矢量动画，支持调整骑行速度、冲刺、喉囊藏鱼与昼夜切换。">
  <title>鹈鹕骑车 · Gemini 4 Argon High 20261014</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <style>
    :root {
      --sky-top: #38bdf8;
      --sky-bottom: #bae6fd;
      --sun-color: #fde047;
      --hill-far: #7dd3fc;
      --hill-near: #34d399;
      --ground: #059669;
      --road: #334155;
      --road-line: #f8fafc;
      --panel-bg: rgba(255, 255, 255, 0.88);
      --text-main: #0f172a;
    }

    body.night {
      --sky-top: #0f172a;
      --sky-bottom: #1e1b4b;
      --sun-color: #fef08a;
      --hill-far: #1e293b;
      --hill-near: #064e3b;
      --ground: #022c22;
      --road: #0f172a;
      --road-line: #94a3b8;
      --panel-bg: rgba(15, 23, 42, 0.85);
      --text-main: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background 0.4s ease;
    }

    .stage-container {
      width: 100%;
      max-width: 920px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 70%);
      transition: background 0.5s ease;
    }

    .controls {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      color: var(--text-main);
      padding: 10px 20px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      flex-wrap: wrap;
      justify-content: center;
      width: max-content;
      max-width: 92%;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="range"] {
      accent-color: #f97316;
      cursor: pointer;
      width: 110px;
    }

    button {
      background: #f97316;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    button:hover {
      background: #ea580c;
      transform: translateY(-1px);
    }

    button.secondary {
      background: #3b82f6;
    }

    button.secondary:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>

      <defs>

  <script>
    // 核心几何常量配置
    const CRANK_CENTER = { x: 420, y: 370 };
    const CRANK_RADIUS = 38;
    const HIP_BASE = { x: 355, y: 245 };
    const THIGH_LEN = 76; // 大腿长度
    const CALF_LEN = 78;  // 小腿长度

    // 动画状态
    let angle = 0;
    let baseSpeed = 1.2;
    let boostMultiplier = 1.0;
    let hasFish = true;
    let roadOffset = 0;
    let treePositions = [120, 460, 800];
    let cloudPositions = [150, 550];

    // DOM 元素引用
    const rigRoot = document.getElementById('rigRoot');
    const pelicanBody = document.getElementById('pelicanBody');
    const rearWheel = document.getElementById('rearWheel');
    const frontWheel = document.getElementById('frontWheel');
    const chainring = document.getElementById('chainring');
    const chainLoop = document.getElementById('chainLoop');

    const rightCrank = document.getElementById('rightCrank');
    const leftCrank = document.getElementById('leftCrank');
    const rightPedal = document.getElementById('rightPedal');
    const leftPedal = document.getElementById('leftPedal');
    const rightLegBone = document.getElementById('rightLegBone');
    const leftLegBone = document.getElementById('leftLegBone');
    const rightFoot = document.getElementById('rightFoot');
    const leftFoot = document.getElementById('leftFoot');
    const rightHipCover = document.getElementById('rightHipCover');

    const gularPouch = document.getElementById('gularPouch');
    const pouchCrease = document.getElementById('pouchCrease');
    const fishSprite = document.getElementById('fishSprite');
    const scarfTail = document.getElementById('scarfTail');
    const rightWing = document.getElementById('rightWing');
    const wingTip = document.getElementById('wingTip');
    const eyeGroup = document.getElementById('eyeGroup');
    const roadStripe = document.getElementById('roadStripe');
    const treesGroup = document.getElementById('trees').children;
    const cloudsGroup = document.getElementById('clouds').children;
    const bikeShadow = document.getElementById('bikeShadow');
    const speedLines = document.getElementById('speedLines');

    /**
     * 双连杆二维逆运动学（2D 2-Link Inverse Kinematics）
     * 根据髋关节 (hx, hy) 与脚踏板 (px, py) 坐标，解算膝关节坐标 (kx, ky)
     */
    function solveKneeIK(hx, hy, px, py, l1, l2) {
      const dx = px - hx;
      const dy = py - hy;
      let dist = Math.hypot(dx, dy);

      // 防止超出骨骼最大伸展极限
      const maxReach = l1 + l2 - 0.5;
      if (dist > maxReach) dist = maxReach;

      // 余弦定理求大腿与连线的夹角
      const cosAlpha = (l1 * l1 + dist * dist - l2 * l2) / (2 * l1 * dist);
      const alpha = Math.acos(Math.max(-1, Math.min(1, cosAlpha)));

      // 连线基准角（膝盖朝车身前方即右侧弯曲，因此减去 alpha）
      const baseTheta = Math.atan2(dy, dx);
      const kneeTheta = baseTheta - alpha;

      return {
        x: hx + l1 * Math.cos(kneeTheta),
        y: hy + l1 * Math.sin(kneeTheta)
      };
    }

    // 更新单侧腿部、曲柄与脚蹼姿态
    function updateLegAndPedal(pedalAngle, hipX, hipY, isRight) {
      const px = CRANK_CENTER.x + CRANK_RADIUS * Math.cos(pedalAngle);
      const py = CRANK_CENTER.y + CRANK_RADIUS * Math.sin(pedalAngle);

      // 腳踝比踏板略高一点
      const ankleX = px - 4;
      const ankleY = py - 6;

      const knee = solveKneeIK(hipX, hipY, ankleX, ankleY, THIGH_LEN, CALF_LEN);

      const crankEl = isRight ? rightCrank : leftCrank;
      const pedalEl = isRight ? rightPedal : leftPedal;
      const legEl = isRight ? rightLegBone : leftLegBone;
      const footEl = isRight ? rightFoot : leftFoot;

      crankEl.setAttribute('x2', px.toFixed(1));
      crankEl.setAttribute('y2', py.toFixed(1));

      pedalEl.setAttribute('transform', `translate(${px.toFixed(1)}, ${py.toFixed(1)})`);
      legEl.setAttribute('points', `${hipX.toFixed(1)},${hipY.toFixed(1)} ${knee.x.toFixed(1)},${knee.y.toFixed(1)} ${ankleX.toFixed(1)},${ankleY.toFixed(1)}`);

      // 脚蹼随踩踏角度轻微踮起/放平
      const footTilt = Math.sin(pedalAngle) * 12;
      footEl.setAttribute('transform', `translate(${ankleX.toFixed(1)}, ${ankleY.toFixed(1)}) rotate(${footTilt.toFixed(1)})`);
    }

    // 主渲染循环
    function animate(timestamp) {
      const currentSpeed = baseSpeed * boostMultiplier;
      angle += 0.065 * currentSpeed;

      // 冲刺衰减回落
      if (boostMultiplier > 1.0) {
        boostMultiplier = Math.max(1.0, boostMultiplier - 0.015);
      }
      speedLines.setAttribute('opacity', boostMultiplier > 1.25 ? ((boostMultiplier - 1.2) * 0.8).toFixed(2) : '0');

      // 1. 车身整体颠簸与呼吸弹性（双倍频率对应左右脚交替发力）
      const bounceY = Math.sin(angle * 2) * 3.5;
      const pitchDeg = Math.cos(angle * 2) * 1.4 - (boostMultiplier - 1) * 4;
      rigRoot.setAttribute('transform', `translate(0, ${bounceY.toFixed(2)})`);
      bikeShadow.setAttribute('rx', (185 - bounceY * 2).toFixed(1));

      // 2. 车轮与牙盘旋转
      const wheelDeg = (angle * 180 / Math.PI * 1.35) % 360;
      const crankDeg = (angle * 180 / Math.PI) % 360;
      rearWheel.setAttribute('transform', `rotate(${wheelDeg.toFixed(1)})`);
      frontWheel.setAttribute('transform', `rotate(${wheelDeg.toFixed(1)})`);
      chainring.setAttribute('transform', `translate(420, 370) rotate(${crankDeg.toFixed(1)})`);
      chainLoop.setAttribute('stroke-dashoffset', (-angle * 25).toFixed(1));

      // 3. 鹈鹕身体微俯仰与髋关节位置同步
      pelicanBody.setAttribute('transform', `rotate(${pitchDeg.toFixed(2)} 365 240)`);
      const hipX = HIP_BASE.x;
      const hipY = HIP_BASE.y + bounceY * 0.4;
      rightHipCover.setAttribute('cx', hipX.toFixed(1));
      rightHipCover.setAttribute('cy', hipY.toFixed(1));

      // 4. 左右双腿逆运动学解算（相差 π 弧度）
      updateLegAndPedal(angle, hipX, hipY, true);
      updateLegAndPedal(angle + Math.PI, hipX - 4, hipY - 2, false);

      // 5. 大嘴喉囊（Gular Pouch）果冻弹性晃动
      const pouchSwing = Math.sin(angle * 2 - 0.8) * 14 * Math.min(currentSpeed, 2.2);
      const pouchBottomY = 178 + pouchSwing;
      gularPouch.setAttribute(
        'd',
        `M 465,98 C 485,${pouchBottomY.toFixed(1)} 595,${(pouchBottomY + 5).toFixed(1)} 638,100 Q 550,104 465,98 Z`
      );
      pouchCrease.setAttribute(
        'd',
        `M 480,110 Q 545,${(152 + pouchSwing * 0.7).toFixed(1)} 615,105`
      );

      // 6. 喉囊里的小鱼跟着颠簸扑腾
      if (hasFish) {
        const fishBob = Math.sin(angle * 2 - 0.5) * 6;
        const fishRot = -28 + Math.cos(angle * 4) * 8;
        fishSprite.setAttribute('transform', `translate(555, ${(118 + fishBob).toFixed(1)}) rotate(${fishRot.toFixed(1)})`);
      }

      // 7. 红领巾与翅膀随风摆动
      const scarfWave = Math.sin(angle * 3) * 10;
      scarfTail.setAttribute(
        'd',
        `M428,176 Q370,${(162 + scarfWave).toFixed(1)} 325,${(178 - scarfWave * 0.8).toFixed(1)} Q365,${(198 + scarfWave * 0.5).toFixed(1)} 425,188 Z`
      );

      const elbowY = 195 + Math.sin(angle * 2) * 4;
      rightWing.setAttribute(
        'd',
        `M 385,198 C 415,${(elbowY - 15).toFixed(1)} 455,${(elbowY + 8).toFixed(1)} 524,225 C 480,238 430,240 390,222 Z`
      );

      // 8. 周期性自然眨眼
      const blinkCycle = timestamp % 3600;
      const eyeScaleY = (blinkCycle > 3450 && blinkCycle < 3570) ? 0.1 : 1;
      eyeGroup.setAttribute('transform', `translate(465, 82) scale(1, ${eyeScaleY}) translate(-465, -82)`);

      // 9. 公路标线、树木与云朵视差滚动
      roadOffset = (roadOffset + 4.5 * currentSpeed) % 90;
      roadStripe.setAttribute('transform', `translate(${-roadOffset.toFixed(1)}, 0)`);

      const scales = [1, 0.85, 1.1];
      const treeYs = [345, 355, 340];
      for (let i = 0; i < treePositions.length; i++) {
        treePositions[i] -= 1.8 * currentSpeed;
        if (treePositions[i] < -60) treePositions[i] = 960;
        treesGroup[i].setAttribute(
          'transform',
          `translate(${treePositions[i].toFixed(1)}, ${treeYs[i]}) scale(${scales[i]})`
        );
      }

      const cloudYs = [70, 110];
      const cloudScales = [1, 0.75];
      for (let i = 0; i < cloudPositions.length; i++) {
        cloudPositions[i] -= 0.35 * currentSpeed;
        if (cloudPositions[i] < -100) cloudPositions[i] = 960;
        cloudsGroup[i].setAttribute(
          'transform',
          `translate(${cloudPositions[i].toFixed(1)}, ${cloudYs[i]}) scale(${cloudScales[i]})`
        );
      }

      requestAnimationFrame(animate);
    }

    // 绑定交互事件
    document.getElementById('speedRange').addEventListener('input', (e) => {
      baseSpeed = parseFloat(e.target.value);
    });

    document.getElementById('boostBtn').addEventListener('click', () => {
      boostMultiplier = 2.4;
    });

    const fishBtn = document.getElementById('fishBtn');
    fishBtn.addEventListener('click', () => {
      hasFish = !hasFish;
      fishSprite.style.display = hasFish ? 'block' : 'none';
      fishBtn.textContent = `🐟 喉囊藏鱼：${hasFish ? '开' : '关'}`;
    });

    document.getElementById('themeBtn').addEventListener('click', () => {
      document.body.classList.toggle('night');
    });

    requestAnimationFrame(animate);
  </script>
</body>
</html>
