  <path d="M143 606 109 800M516 606 470 800M934 606 945 800" stroke="#ba835f" stroke-width="2" opacity=".11"/>
  <path d="M125 493 552 493 757 800 48 800Z" fill="#ffe4ad" opacity=".11"/>

