<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">夏日空调房</title>
  <desc id="desc">窗外骄阳与缓缓飘过的云，窗内空调送出凉风，窗帘轻摆，小猫在沙发上睡觉。</desc>
  <defs>
    <linearGradient id="wall" x2="0" y2="1">
      <stop stop-color="#fff8e9"/><stop offset="1" stop-color="#f5ead9"/>
    </linearGradient>
    <linearGradient id="floor" x2="0" y2="1">
      <stop stop-color="#efc9a5"/><stop offset="1" stop-color="#daa67d"/>
    </linearGradient>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#91d8e5"/><stop offset=".63" stop-color="#bce6df"/><stop offset="1" stop-color="#ffe2a9"/>
    </linearGradient>
    <linearGradient id="curtain" x2="0" y2="1">
      <stop stop-color="#e7ac8d"/><stop offset="1" stop-color="#cd7f75"/>
    </linearGradient>
    <linearGradient id="sofa" x2="0" y2="1">
      <stop stop-color="#79bbb6"/><stop offset="1" stop-color="#458f91"/>
    </linearGradient>
    <linearGradient id="sofaSeat" x2="0" y2="1">
      <stop stop-color="#99d1c7"/><stop offset="1" stop-color="#6eafa8"/>
    </linearGradient>
    <linearGradient id="glass" x2="0" y2="1">
      <stop stop-color="#d0f5ef" stop-opacity=".58"/><stop offset="1" stop-color="#6bbfc0" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="air" x2="0" y2="1">
      <stop stop-color="#75c9d0" stop-opacity=".72"/><stop offset="1" stop-color="#b9e8dd" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop stop-color="#ffefae" stop-opacity=".72"/><stop offset="1" stop-color="#ffe7a0" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-35%" width="150%" height="185%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#775e55" flood-opacity=".17"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-40%" width="160%" height="190%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#385959" flood-opacity=".15"/>
    </filter>
    <clipPath id="view"><rect x="124" y="141" width="402" height="332" rx="5"/></clipPath>
    <style>
      <![CDATA[
        .sun-halo {transform-origin:444px 208px;animation:glow 5s ease-in-out infinite}
        .cloud-one {animation:cloud 15s ease-in-out infinite alternate}
        .cloud-two {animation:cloud 19s ease-in-out infinite alternate-reverse}
        .heat {animation:heat 3.5s ease-in-out infinite}
        .heat:nth-of-type(2) {animation-delay:-1.2s}
        .heat:nth-of-type(3) {animation-delay:-2.1s}
        .curtain-left {transform-origin:140px 124px;animation:curtainLeft 6s ease-in-out infinite}
        .curtain-right {transform-origin:508px 124px;animation:curtainRight 6.8s ease-in-out infinite}
        .airline {fill:none;stroke:url(#air);stroke-width:5;stroke-linecap:round;stroke-dasharray:34 27;animation:airflow 3.2s linear infinite}
        .airline:nth-child(2) {animation-delay:-1s;stroke-width:4}
        .airline:nth-child(3) {animation-delay:-2s;stroke-width:3.5}
        .snow {transform-box:fill-box;transform-origin:center;animation:float 5s ease-in-out infinite}
        .snow.delay {animation-delay:-2.4s}
        .louver {transform-origin:900px 226px;animation:louver 5s ease-in-out infinite}
        .cat-body {transform-origin:881px 588px;animation:breathe 3.8s ease-in-out infinite}
        .cat-tail {transform-origin:958px 594px;animation:tail 5s ease-in-out infinite}
        .z1 {animation:zzz 3.6s ease-out infinite}
        .z2 {animation:zzz 3.6s ease-out -1.6s infinite}
        .plant-leaf {transform-origin:166px 610px;animation:leaf 6s ease-in-out infinite}
        .plant-leaf:nth-child(even) {animation-delay:-2.5s}
        .ice {animation:ice 4s ease-in-out infinite alternate}
        @keyframes glow {50% {transform:scale(1.13);opacity:.75}}
        @keyframes cloud {to {transform:translateX(38px)}}
        @keyframes heat {50% {transform:translateX(6px);opacity:.22}}
        @keyframes curtainLeft {50% {transform:rotate(2deg)}}
        @keyframes curtainRight {50% {transform:rotate(-2deg)}}
        @keyframes airflow {to {stroke-dashoffset:-122}}
        @keyframes float {50% {transform:translate(8px,13px) rotate(18deg);opacity:.35}}
        @keyframes louver {50% {transform:rotate(3deg)}}
        @keyframes breathe {50% {transform:scale(1.025,.975)}}
        @keyframes tail {50% {transform:rotate(-11deg)}}
        @keyframes zzz {0% {transform:translate(0,8px);opacity:0} 22% {opacity:.8} 100% {transform:translate(10px,-27px);opacity:0}}
        @keyframes leaf {50% {transform:rotate(3deg)}}
        @keyframes ice {to {transform:translateY(3px)}}
        @media (prefers-reduced-motion:reduce) {* {animation:none!important}}
      ]]>
    </style>
  </defs>

