                <path d="M0-17V17M-17 0H17M-12-12l24 24M-12 12l24-24"/>
                <circle r="20" stroke="#6c8171" stroke-width="2" stroke-dasharray="2 4"/>
              </g>
            </g>
            <path id="crank" d="M661 550 696 570 731 590" fill="none" stroke="#304c4b" stroke-width="5" stroke-linecap="round"/>
            <circle cx="696" cy="570" r="7" fill="#d4dcc0" stroke="#304c4b" stroke-width="2.5"/>

            <!-- 近侧腿用关节解算跟随脚踏，保持脚掌与踏板接触。 -->
            <g id="near-leg" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path id="near-leg-path" d="M686 482 734 508 731 585" stroke="#ab8045" stroke-width="12"/>
              <path id="near-leg-highlight" d="M686 482 734 508 731 585" stroke="#edbd6f" stroke-width="7"/>
              <path id="near-knee-detail" d="M727 506q5 3 9 1" stroke="#d09d54" stroke-width="2"/>
            </g>

            <!-- 鸟的尾羽、身体和翅膀。 -->
            <g id="bird-body">
              <g id="tail">
                <path d="M600 387Q555 402 531 387Q539 376 566 361Q543 366 529 351Q550 336 590 340Z" fill="#e9eee0" stroke="#2e4e50" stroke-width="3.2" stroke-linejoin="round"/>
                <path d="M536 351q24 9 52 6m-42 27q22-10 47-14" fill="none" stroke="#bccfc4" stroke-width="2.5" stroke-linecap="round"/>
              </g>

              <!-- 鹈鹏的身体向车把倾斜，长颈从背部自然升起。 -->
              <path d="M580 341C589 298 628 297 657 317C684 336 689 338 703 306L720 253C713 228 725 201 754 196C786 190 809 211 807 240C806 260 784 276 770 288C768 310 772 344 757 379C741 416 707 440 660 434C611 429 571 392 580 341Z" fill="#fffbed" stroke="#2e4e50" stroke-width="3.8" stroke-linejoin="round"/>
              <path d="M584 360C598 397 628 411 662 412C710 414 741 374 746 345C755 364 750 389 731 408C707 433 680 439 650 431C616 423 590 402 584 380Z" fill="#d6e5db"/>
              <path d="M733 277C739 301 727 337 714 357" fill="none" stroke="#e6eee0" stroke-width="10" stroke-linecap="round"/>
              <path d="M653 431q7 8 13 1q7 10 13 1q9 7 14-1" fill="#fffbed" stroke="#2e4e50" stroke-width="2.3" stroke-linecap="round"/>
              <path d="M608 325q12-8 23-3m-27 12q14-8 25-3" fill="none" stroke="#d6e3d5" stroke-width="2.5" stroke-linecap="round"/>

              <!-- 随风飘动的围巾。 -->
              <g id="scarf-tails" fill="#3d8e9c" stroke="#2e4e50" stroke-width="2.5" stroke-linejoin="round">
                <path id="scarf-back" d="M716 290C684 279 670 294 644 278C624 266 608 273 589 263L592 282C614 292 628 282 647 295C671 311 688 296 715 304Z" fill="#67afb2"/>
                <path id="scarf-front" d="M714 288C683 291 664 305 638 299C614 293 601 303 579 298L585 318C608 322 622 311 644 316C675 324 690 303 721 305Z"/>
                <path id="scarf-stripe" d="M590 304l3 10m7-11 3 9" fill="none" stroke="#9bc9c6" stroke-width="3"/>
              </g>
              <path d="M718 282Q740 296 769 279L773 293Q745 310 714 299Z" fill="#4a9eaa" stroke="#2e4e50" stroke-width="2.5"/>
              <path d="m731 290 1 9m14-5 1 8" stroke="#8ec5c4" stroke-width="3" stroke-linecap="round"/>

              <!-- 头：长嘴和明显的喉囊。 -->
              <g id="bird-head">
                <path d="M799 236L959 243C950 268 922 289 881 296C843 302 811 286 790 264Z" fill="url(#pouch)" stroke="#2e4e50" stroke-width="3.2" stroke-linejoin="round"/>
                <path d="M814 260Q843 289 880 288Q914 287 935 268" fill="none" stroke="#e0a457" stroke-width="2.6" stroke-linecap="round"/>
                <path d="M801 229C845 229 904 231 959 243Q968 247 959 252L803 251Q793 246 801 229Z" fill="#f4b559" stroke="#2e4e50" stroke-width="3.2" stroke-linejoin="round"/>
                <path d="m810 239 133 8" fill="none" stroke="#ffda8e" stroke-width="3" stroke-linecap="round"/>
                <path d="M959 243q8 4 0 9l-8-1" fill="#d88943" stroke="#2e4e50" stroke-width="2" stroke-linejoin="round"/>
                <path d="M801 251q-9 16-17 17" fill="none" stroke="#2e4e50" stroke-width="2" stroke-linecap="round"/>
                <ellipse cx="795" cy="260" rx="8" ry="5" fill="#efb197" opacity=".65"/>

                <g id="eye" transform="translate(783 229)">
                  <ellipse rx="6" ry="8" fill="#23464b"/>
                  <circle cx="1.6" cy="-2.5" r="1.8" fill="#fffdf0"/>
                </g>
                <path d="M774 214q8-6 15-1" fill="none" stroke="#44635d" stroke-width="2.3" stroke-linecap="round"/>

                <!-- 绿色骑行头盔。 -->
                <path d="M716 215C711 183 734 168 760 171C786 172 805 190 805 212Q768 207 733 222Z" fill="url(#helmet)" stroke="#2e4e50" stroke-width="3.3" stroke-linejoin="round"/>
                <path d="M721 212Q758 198 805 210L814 214Q817 219 811 221L771 218Q744 220 730 228Z" fill="#7aa887" stroke="#2e4e50" stroke-width="2.7" stroke-linejoin="round"/>
                <path d="M745 177q-14 12-14 27M764 176q-5 11-3 23M783 185q3 6 4 16" fill="none" stroke="#699984" stroke-width="4" stroke-linecap="round"/>
                <path d="M724 191q4-7 11-10" fill="none" stroke="#d2e2b6" stroke-width="3" stroke-linecap="round"/>
                <path d="M736 221q-1 24 20 51l23-16" fill="none" stroke="#637e70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="753" y="262" width="10" height="7" rx="2" fill="#48665e" transform="rotate(29 758 265)"/>
              </g>

              <!-- 翅膀握住车把，掌部固定在车把附近。 -->
              <path id="wing" d="M625 339C650 326 677 344 705 354C735 365 764 369 801 376Q816 374 824 385Q826 391 819 394L786 394C748 395 703 390 673 379C643 369 622 369 619 355Q617 345 625 339Z" fill="#f8f8e8" stroke="#2e4e50" stroke-width="3.4" stroke-linejoin="round"/>
              <path d="M637 348C661 342 688 367 722 374Q760 383 794 383" fill="none" stroke="#ccded1" stroke-width="3" stroke-linecap="round"/>
              <path d="M805 383q4 5 3 10m4-12q5 4 5 11" fill="none" stroke="#748f80" stroke-width="2.3" stroke-linecap="round"/>
              <path d="M637 351q-5 5-3 10m12-6q-3 4-2 9m13-5-2 7" fill="none" stroke="#d5e2d3" stroke-width="2" stroke-linecap="round"/>
            </g>

            <g id="near-foot" transform="translate(731 585)">
              <path d="M-8-7Q-4-11 3-6L21-2Q29 1 27 5H-9Z" fill="#eab45f" stroke="#a58044" stroke-width="2.3" stroke-linejoin="round"/>
              <path d="M5-3 8 3m8-4 3 4" fill="none" stroke="#bd9048" stroke-width="1.6" stroke-linecap="round"/>
            </g>
            <g id="near-pedal" transform="translate(731 590)">
              <path d="M-16 0H16" stroke="#253f43" stroke-width="6" stroke-linecap="round"/>
              <path d="M-11-1H11" stroke="#97a892" stroke-width="2" stroke-linecap="round"/>
            </g>
          </g>

          <!-- 前景花草比远山移动更快。 -->
          <g id="foreground">
            <use href="#foreground-plants"/>
            <use href="#foreground-plants" x="1440"/>
          </g>
        </g>
      </svg>
    </div>

    <div class="controls">
      <button class="play-toggle" id="play-toggle" type="button" aria-label="暂停动画">
        <svg viewBox="0 0 20 20" aria-hidden="true" fill="currentColor">
          <g id="pause-icon"><rect x="5" y="4" width="3.5" height="12" rx="1"/><rect x="11.5" y="4" width="3.5" height="12" rx="1"/></g>
          <path id="play-icon" d="M6 3.8Q6 2.7 7 3.3L16 9.3Q17 10 16 10.7L7 16.7Q6 17.3 6 16.2Z" hidden style="display:none"/>
        </svg>
        <span id="play-label">暂停动画</span>
      </button>
    </div>
    <span class="sr-only" id="animation-status" role="status" aria-live="polite"></span>
  </main>

  <script>
    (() => {
      'use strict';

      const $ = id => document.getElementById(id);
      const refs = {
        rider: $('rider'), shadow: $('ground-shadow'),
        rearWheel: $('rear-wheel'), frontWheel: $('front-wheel'),
        chainring: $('chainring'), crank: $('crank'),
        farLeg: $('far-leg-path'), farHighlight: $('far-leg-highlight'),
        nearLeg: $('near-leg-path'), nearHighlight: $('near-leg-highlight'),
        nearKnee: $('near-knee-detail'),
        farFoot: $('far-foot'), nearFoot: $('near-foot'),
        farPedal: $('far-pedal'), nearPedal: $('near-pedal'),
        body: $('bird-body'), tail: $('tail'), eye: $('eye'),
        scarfBack: $('scarf-back'), scarfFront: $('scarf-front'), scarfStripe: $('scarf-stripe'),
        cloudsBack: $('clouds-back'), cloudsFront: $('clouds-front'), hills: $('hills'),
        waves: $('waves'), sailboat: $('sailboat'), skyBirdA: $('sky-bird-a'), skyBirdB: $('sky-bird-b'),
        fence: $('fence'), road: $('road-lines'), specks: $('sand-specks'),
        plants: $('roadside-plants'), foreground: $('foreground'),
        button: $('play-toggle'), label: $('play-label'),
        playIcon: $('play-icon'), pauseIcon: $('pause-icon'), status: $('animation-status')
      };

      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const TAU = Math.PI * 2;
      const pedalPeriod = 1.9;
      const crankRadius = 39;
      const wheelRadius = 91;
      // 齿比控制轮速；道路移动距离与轮周长一致。
      const gearRatio = 2.05;
      const roadSpeed = TAU * wheelRadius * gearRatio / pedalPeriod;
      let playing = !reducedMotion.matches;
      let time = 0;
      let lastTimestamp = null;
      let frameId = null;

      const f = value => value.toFixed(2);
      const move = (element, x, y = 0) => element.setAttribute('transform', `translate(${f(x)} ${f(y)})`);
      const scroll = (element, distance, repeat) => move(element, -(distance % repeat));

      // 二节腿的逆运动学：髋关节固定，脚跟随踏板，膝盖向行进方向弯曲。
      function legPose(hip, ankle, upperLength, lowerLength) {
        const dx = ankle.x - hip.x;
        const dy = ankle.y - hip.y;
        const distance = Math.min(Math.hypot(dx, dy), upperLength + lowerLength - .01);
        const heading = Math.atan2(dy, dx);
        const cosAngle = Math.max(-1, Math.min(1,
          (upperLength * upperLength + distance * distance - lowerLength * lowerLength) /
          (2 * upperLength * Math.max(distance, .01))));
        const bend = heading - Math.acos(cosAngle);
        const knee = {
          x: hip.x + Math.cos(bend) * upperLength,
          y: hip.y + Math.sin(bend) * upperLength
        };
        return {
          path: `M${f(hip.x)} ${f(hip.y)} L${f(knee.x)} ${f(knee.y)} L${f(ankle.x)} ${f(ankle.y)}`,
          knee
        };
      }

      function draw(t) {
        const phase = t * TAU / pedalPeriod + .55;
        const bounce = Math.sin(phase * 2) * 1.45;
        const breath = Math.sin(phase) * 1.7;
        const flutter = Math.sin(t * 6.8);
        const flutter2 = Math.sin(t * 6.8 - .7);
        const distance = roadSpeed * t;
        const wheelAngle = (distance / wheelRadius * 180 / Math.PI) % 360;

        move(refs.rider, 0, bounce);
        refs.shadow.setAttribute('rx', f(243 + Math.sin(phase * 2) * 3));
        refs.shadow.setAttribute('opacity', f(.13 - bounce * .002));
        refs.rearWheel.setAttribute('transform', `rotate(${f(wheelAngle)})`);
        refs.frontWheel.setAttribute('transform', `rotate(${f(wheelAngle)})`);
        refs.chainring.setAttribute('transform', `rotate(${f(phase * 180 / Math.PI % 360)})`);

        const near = {
          x: 696 + Math.cos(phase) * crankRadius,
          y: 570 + Math.sin(phase) * crankRadius
        };
        const far = {
          x: 696 - Math.cos(phase) * crankRadius,
          y: 570 - Math.sin(phase) * crankRadius
        };
        // 鸟的大腿藏在腹部内，脚与脚踏位于同一条旋转轨道。
        const nearPose = legPose({ x: 686, y: 420 + breath }, { x: near.x, y: near.y - 5 }, 100, 96);
        const farPose = legPose({ x: 667, y: 422 + breath }, { x: far.x, y: far.y - 5 }, 96, 100);
        refs.nearLeg.setAttribute('d', nearPose.path);
        refs.nearHighlight.setAttribute('d', nearPose.path);
        refs.farLeg.setAttribute('d', farPose.path);
        refs.farHighlight.setAttribute('d', farPose.path);
        refs.nearKnee.setAttribute('d', `M${f(nearPose.knee.x - 4)} ${f(nearPose.knee.y - 2)}q5 4 9 1`);
        refs.crank.setAttribute('d', `M${f(far.x)} ${f(far.y)}L696 570L${f(near.x)} ${f(near.y)}`);
        move(refs.nearFoot, near.x, near.y - 5);
        move(refs.farFoot, far.x, far.y - 5);
        move(refs.nearPedal, near.x, near.y);
        move(refs.farPedal, far.x, far.y);

        // 轻微呼吸、尾羽抖动和柔软围巾，避免僵硬的整图平移。
        refs.body.setAttribute('transform', `translate(0 ${f(breath)}) rotate(${f(Math.sin(phase) * .4)} 818 385)`);
        refs.tail.setAttribute('transform', `rotate(${f(flutter * 2.5)} 595 359)`);
        refs.scarfBack.setAttribute('d',
          `M716 290C684 ${f(279 + flutter2 * 5)} 670 ${f(294 + flutter * 6)} 644 ${f(278 + flutter2 * 6)}C624 ${f(266 + flutter * 8)} 608 ${f(273 + flutter2 * 7)} 589 ${f(263 + flutter * 9)}L592 ${f(282 + flutter * 9)}C614 ${f(292 + flutter2 * 7)} 628 ${f(282 + flutter * 8)} 647 ${f(295 + flutter2 * 6)}C671 ${f(311 + flutter * 6)} 688 ${f(296 + flutter2 * 5)} 715 304Z`);
        refs.scarfFront.setAttribute('d',
          `M714 288C683 ${f(291 + flutter * 4)} 664 ${f(305 + flutter2 * 6)} 638 ${f(299 + flutter * 7)}C614 ${f(293 + flutter2 * 9)} 601 ${f(303 + flutter * 8)} 579 ${f(298 + flutter2 * 9)}L585 ${f(318 + flutter2 * 9)}C608 ${f(322 + flutter * 8)} 622 ${f(311 + flutter2 * 9)} 644 ${f(316 + flutter * 7)}C675 ${f(324 + flutter2 * 6)} 690 ${f(303 + flutter * 4)} 721 305Z`);
        refs.scarfStripe.setAttribute('d', `M590 ${f(304 + flutter2 * 9)}l3 10m7-11 3 9`);

        // 每隔几秒眨眼，暂停后所有部件停留在当前画面。
        const blinkClock = t % 5.8;
        const blink = blinkClock > 4.9 && blinkClock < 5.1
          ? Math.max(.12, Math.abs(blinkClock - 5) / .1) : 1;
        refs.eye.setAttribute('transform', `translate(783 229) scale(1 ${f(blink)})`);

        scroll(refs.cloudsBack, t * 5.4, 1286);
        scroll(refs.cloudsFront, t * 9.3, 1286);
        scroll(refs.hills, t * 13, 850);
        scroll(refs.waves, t * 26, 1440);
        const boatX = ((312 - t * 12 + 200) % 1840 + 1840) % 1840 - 200;
        move(refs.sailboat, boatX, 449 + Math.sin(t * 1.7) * 1.7);

        const flap = Math.sin(t * 2.4) * 4;
        refs.skyBirdA.setAttribute('d', `M180 309q9 ${f(-10 + flap)} 18 0q9 ${f(-10 + flap)} 18 0`);
        refs.skyBirdB.setAttribute('d', `M219 285q7 ${f(-8 - flap * .6)} 14 0q7 ${f(-8 - flap * .6)} 14 0`);

        scroll(refs.fence, distance * .45, 1536);
        scroll(refs.plants, distance * .55, 1440);
        scroll(refs.road, distance, 1440);
        scroll(refs.specks, distance, 1440);
        scroll(refs.foreground, distance * 1.28, 1440);
      }

      function updateButton() {
        const label = playing ? '暂停动画' : '播放动画';
        refs.label.textContent = label;
        refs.button.setAttribute('aria-label', label);
        refs.button.title = `${label}（空格键）`;
        refs.pauseIcon.style.display = playing ? '' : 'none';
        refs.playIcon.style.display = playing ? 'none' : '';
        refs.playIcon.removeAttribute('hidden');
      }

      function tick(timestamp) {
        frameId = null;
        if (!playing || document.hidden) {
          lastTimestamp = null;
          return;
        }
        if (lastTimestamp !== null) time += Math.min((timestamp - lastTimestamp) / 1000, .05);
        lastTimestamp = timestamp;
        draw(time);
        frameId = requestAnimationFrame(tick);
      }

      function schedule() {
        if (playing && !document.hidden && frameId === null) frameId = requestAnimationFrame(tick);
      }

      function setPlaying(value, announce = false) {
        playing = value;
        lastTimestamp = null;
        if (frameId !== null) cancelAnimationFrame(frameId);
        frameId = null;
        updateButton();
        if (announce) refs.status.textContent = playing ? '动画正在播放。' : '动画已暂停。';
        schedule();
      }

      refs.button.addEventListener('click', () => setPlaying(!playing, true));
      document.addEventListener('keydown', event => {
        if (event.code === 'Space' && !event.repeat && !event.altKey && !event.ctrlKey && !event.metaKey &&
            event.target !== refs.button && !event.target.closest('input, textarea, select, [contenteditable="true"]')) {
          event.preventDefault();
          setPlaying(!playing, true);
        }
      });
      document.addEventListener('visibilitychange', () => {
        lastTimestamp = null;
        if (document.hidden && frameId !== null) {
          cancelAnimationFrame(frameId);
          frameId = null;
        } else {
          schedule();
        }
      });
      const onMotionChange = event => setPlaying(!event.matches);
      if (reducedMotion.addEventListener) reducedMotion.addEventListener('change', onMotionChange);
      else reducedMotion.addListener(onMotionChange);

      draw(0);
      updateButton();
      schedule();
    })();
  </script>
</body>
